<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>框架練習機器人 - AI V2.6 STRUCTURED FINAL</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial,sans-serif}
:root{--primary:#4285f4;--border:#d9dde5;--muted:#6b7280}
html,body{margin:0;height:100%;background:#eef2ff;color:#222}
body{overflow:hidden}
.header{height:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#3f80ee,#5e7fe9);color:#fff;font-size:30px;font-weight:700}
.status{height:54px;padding:15px 20px;background:#fff;color:#07945b;border-bottom:1px solid #e5e7eb;font-size:16px}
.app{height:calc(100vh - 146px);display:flex;background:#fff}
.left{width:420px;min-width:340px;padding:18px 20px 30px;border-right:1px solid var(--border);overflow-y:auto}
.right{flex:1;min-width:0;display:flex;flex-direction:column}
h3{margin:14px 0 10px;font-size:20px}
textarea,select{width:100%;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;padding:12px 14px;background:#fff}
textarea:focus,select:focus{outline:2px solid rgba(66,133,244,.18);border-color:var(--primary)}
#topic{min-height:110px;resize:vertical}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fbtn{height:68px;border-radius:10px;background:#fff;font-size:17px;font-weight:700;cursor:pointer;border:2px solid;transition:.12s}
.fbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.fbtn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.fbtn[data-name="崩解"]{color:#ff3b3b;border-color:#ff3b3b}
.fbtn[data-name="識別"]{color:#7c3aed;border-color:#7c3aed}
.fbtn[data-name="確認"]{color:#f59e0b;border-color:#f59e0b}
.fbtn[data-name="壓縮"]{color:#10b981;border-color:#10b981}
.fbtn[data-name="分割"]{color:#06b6d4;border-color:#06b6d4}
.fbtn[data-name="解構"]{color:#d946ef;border-color:#d946ef}
.fbtn[data-name="架構"]{color:#ec4899;border-color:#ec4899}
.fbtn[data-name="重構"]{color:#ef4444;border-color:#ef4444}
.fbtn[data-name="植入"]{color:#65a30d;border-color:#65a30d}
.fbtn.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.selected{margin-top:14px;padding:12px 14px;background:#f3f4f6;border-radius:10px;line-height:1.5;min-height:46px}
.hint{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
.chat{flex:1;min-height:0;overflow-y:auto;padding:22px 28px;background:#fafafa}
.empty{color:#9ca3af;text-align:center;margin-top:70px;font-size:17px}
.msg{max-width:86%;white-space:pre-wrap;line-height:1.65;padding:14px 16px;margin:10px 0;border-radius:14px;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--primary);color:#fff}
.msg.ai{margin-right:auto;background:#ececec;color:#111}
.msg.error{margin-right:auto;background:#fee2e2;color:#991b1b}
.bottom{border-top:1px solid #e5e7eb;background:#fff;padding:16px 20px;display:flex;gap:12px;align-items:stretch}
#reply{min-height:82px;resize:vertical}
.send{width:150px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:calc(100vh - 146px);flex-direction:column}.left{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--border)}.right{min-height:600px}.bottom{flex-direction:column}.send{width:100%;height:56px}}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - AI</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>

<div class="app">
<aside class="left">
<h3>初始論述</h3>
<textarea id="topic" placeholder="輸入對方說的話…"></textarea>

<h3>練習模式</h3>
<select id="mode">
<option value="random">隨機一個框架</option>
<option value="all">融合所有框架</option>
<option value="manual">手動選擇框架</option>
</select>

<h3>框架選擇</h3>
<div class="frameworks" id="buttons"></div>
<div class="selected" id="selected"></div>
<div class="hint" id="modeHint"></div>
</aside>

<main class="right">
<div class="chat" id="chat"><div class="empty" id="empty">請輸入初始論述並開始分析</div></div>
<div class="bottom">
<textarea id="reply" placeholder="輸入你的回應（可留空）"></textarea>
<button class="send" id="sendBtn" type="button">開始分析</button>
</div>
</main>
</div>

<script>
"use strict";

const WORKER="https://gemini-framework.baquerodwornik432.workers.dev/";

const FRAMEWORKS={
"崩解":"拆解對方的前提、假設與隱含因果，找出可以被重新檢視的基礎。",
"識別":"辨識真正核心問題、關鍵矛盾與對話焦點。",
"確認":"確認事實、需求、限制、定義與雙方共同認知。",
"壓縮":"把複雜論述濃縮成少數核心命題，降低溝通成本。",
"分割":"把大型或混合問題拆成可個別處理的小問題。",
"解構":"分析論述的組成、關係、因果、角色與權責結構。",
"架構":"重新排列資訊與論點，建立更清楚的溝通結構。",
"重構":"改變原本問題的看法或定義，建立新的理解與方案。",
"植入":"在不破壞原對話的前提下，引入新的判準、資訊或思考方向。"
};

const state={manualFramework:null,randomFramework:null,busy:false};
const INITIAL_RETRY_DELAY_MS=1500;
const MAX_RETRY_DELAY_MS=15000;
const REQUEST_TIMEOUT_MS=60000;

const els={
topic:document.getElementById("topic"),
mode:document.getElementById("mode"),
buttons:document.getElementById("buttons"),
selected:document.getElementById("selected"),
modeHint:document.getElementById("modeHint"),
chat:document.getElementById("chat"),
empty:document.getElementById("empty"),
reply:document.getElementById("reply"),
sendBtn:document.getElementById("sendBtn")
};

function frameworkNames(){return Object.keys(FRAMEWORKS)}
function frameworkObjects(names=frameworkNames()){
return names.map(name=>({name,description:FRAMEWORKS[name]}));
}
function pickRandomFramework(){
const names=frameworkNames();
return names[Math.floor(Math.random()*names.length)];
}
function clearActiveButtons(){
document.querySelectorAll(".fbtn").forEach(btn=>btn.classList.remove("active"));
}
function setActiveButton(name){
clearActiveButtons();
document.querySelectorAll(".fbtn").forEach(btn=>{
if(btn.dataset.name===name)btn.classList.add("active");
});
}
function buildFrameworkButtons(){
for(const name of frameworkNames()){
const btn=document.createElement("button");
btn.type="button";
btn.className="fbtn";
btn.dataset.name=name;
btn.textContent=name;
btn.addEventListener("click",()=>{
state.manualFramework=name;
els.mode.value="manual";
renderModeState();
});
els.buttons.appendChild(btn);
}
}
function renderModeState(){
const mode=els.mode.value;

if(mode==="manual"){
state.randomFramework=null;
if(state.manualFramework){
setActiveButton(state.manualFramework);
els.selected.textContent="目前框架："+state.manualFramework;
els.modeHint.textContent="手動模式：只使用你點選的框架。";
}else{
clearActiveButtons();
els.selected.textContent="手動模式：尚未選擇框架";
els.modeHint.textContent="請從上方 9 個框架中選擇一個。";
}
return;
}

if(mode==="random"){
if(!state.randomFramework)state.randomFramework=pickRandomFramework();
setActiveButton(state.randomFramework);
els.selected.textContent="隨機選擇框架："+state.randomFramework;
els.modeHint.textContent="隨機模式：已自動選定框架，不需要手動點選。";
return;
}

if(mode==="all"){
state.randomFramework=null;
clearActiveButtons();
els.selected.textContent="使用框架：全部9個框架";
els.modeHint.textContent="融合模式：會把 9 個框架以結構化資料一次送給 AI，不會當成單一框架處理。";
}
}
function onModeChanged(){
state.randomFramework=els.mode.value==="random"?pickRandomFramework():null;
renderModeState();
}

function resolveAnalysis(){
const mode=els.mode.value;

if(mode==="manual"){
if(!state.manualFramework)throw new Error("請選擇框架");
return{
mode:"manual",
display:state.manualFramework,
frameworks:frameworkObjects([state.manualFramework])
};
}

if(mode==="random"){
if(!state.randomFramework)state.randomFramework=pickRandomFramework();
return{
mode:"random",
display:state.randomFramework,
frameworks:frameworkObjects([state.randomFramework])
};
}

if(mode==="all"){
return{
mode:"all",
display:"全部9個框架",
frameworks:frameworkObjects()
};
}

throw new Error("未知的練習模式");
}

function addMessage(text,type="ai"){
if(els.empty){els.empty.remove();els.empty=null}
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
els.chat.appendChild(div);
els.chat.scrollTop=els.chat.scrollHeight;
return div;
}

function setBusy(busy){
state.busy=busy;
els.sendBtn.disabled=busy;
els.sendBtn.textContent=busy?"分析中…":"開始分析";
els.mode.disabled=busy;
document.querySelectorAll(".fbtn").forEach(btn=>btn.disabled=busy);
}

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function fetchWithTimeout(url,options,timeoutMs){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeoutMs);
try{
return await fetch(url,{...options,signal:controller.signal});
}finally{
clearTimeout(timer);
}
}

function extractAnswer(data){
return String(data?.text||"").trim();
}

function isPlaceholderAnswer(text){
const value=String(text||"").trim();
if(!value)return true;
const placeholders=[
"AI沒有回覆","AI沒有產生回覆","Gemini沒有回覆",
"Gemini沒有產生內容","GPT沒有回覆","無回覆"
];
return placeholders.some(item=>value===item||value.includes(item));
}

function getApiError(data){
const text=String(data?.text||"").trim();
const candidates=[
data?.error?.message,
typeof data?.error==="string"?data.error:null,
text.startsWith("OpenAI API錯誤：")?text:null,
text.startsWith("Gemini API錯誤：")?text:null,
text.startsWith("Worker錯誤：")?text:null
].filter(Boolean);
return candidates.length?String(candidates[0]):"";
}

function isFatalApiError(message,status){
const text=String(message||"").toLowerCase();
const fatalHints=[
"no credits remaining","insufficient_quota","prepayment credits are depleted",
"invalid api key","incorrect api key","authentication","unauthorized",
"user location is not supported","permission denied"
];
if(status===401||status===403)return true;
return fatalHints.some(hint=>text.includes(hint));
}

function retryMessage(attempt,delay,reason){
const seconds=Math.max(1,Math.round(delay/1000));
return `AI 尚未產生有效回答。\n第 ${attempt} 次尚未成功，${seconds} 秒後自動重試…${reason?`\n原因：${reason}`:""}`;
}

async function analyze(){
if(state.busy)return;

const topic=els.topic.value.trim();
const userReply=els.reply.value.trim();

if(!topic){
alert("請輸入初始論述");
els.topic.focus();
return;
}

let resolved;
try{
resolved=resolveAnalysis();
}catch(error){
alert(error.message);
return;
}

if(resolved.mode==="all"){
els.selected.textContent="使用框架：全部9個框架";
clearActiveButtons();
}else{
els.selected.textContent=(resolved.mode==="random"?"隨機選擇框架：":"目前框架：")+resolved.display;
setActiveButton(resolved.display);
}

addMessage(
"使用框架："+resolved.display+
"\n\n原始論述：\n"+topic+
(userReply?"\n\n我的回應：\n"+userReply:""),
"user"
);

/*
  V2.6 重要修正：
  不再把「全部9框架」硬塞成一大段 prompt。
  改成送結構化 JSON，讓 Worker 根據 mode 明確建立提示詞。
*/
const payload={
action:"framework_analysis",
mode:resolved.mode,
topic,
userReply,
frameworks:resolved.frameworks
};

setBusy(true);
const loading=addMessage("AI 分析中，正在等待有效回答…","ai");

try{
let attempt=0;
let delay=INITIAL_RETRY_DELAY_MS;

while(true){
attempt+=1;

let response;
try{
response=await fetchWithTimeout(
WORKER,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
},
REQUEST_TIMEOUT_MS
);
}catch(error){
const reason=error?.name==="AbortError"?"請求逾時":(error?.message||"連線失敗");
loading.textContent=retryMessage(attempt,delay,reason);
await sleep(delay);
delay=Math.min(delay*2,MAX_RETRY_DELAY_MS);
continue;
}

let raw="";
let data={};
try{
raw=await response.text();
data=raw?JSON.parse(raw):{};
}catch(error){
loading.textContent=retryMessage(attempt,delay,`Worker 回傳不是有效 JSON（HTTP ${response.status}）`);
await sleep(delay);
delay=Math.min(delay*2,MAX_RETRY_DELAY_MS);
continue;
}

const apiError=getApiError(data);

if(!response.ok||apiError){
const reason=apiError||`HTTP ${response.status}`;
if(isFatalApiError(reason,response.status)){
throw new Error(reason);
}
loading.textContent=retryMessage(attempt,delay,reason);
await sleep(delay);
delay=Math.min(delay*2,MAX_RETRY_DELAY_MS);
continue;
}

const answer=extractAnswer(data);
if(answer&&!isPlaceholderAnswer(answer)){
loading.className="msg ai";
loading.textContent=answer;
break;
}

loading.textContent=retryMessage(attempt,delay,"AI 回傳空內容");
await sleep(delay);
delay=Math.min(delay*2,MAX_RETRY_DELAY_MS);
}

}catch(error){
loading.className="msg error";
loading.textContent="無法繼續請求："+(error?.message||String(error));
console.error(error);
}finally{
setBusy(false);
}
}

function init(){
buildFrameworkButtons();
els.mode.addEventListener("change",onModeChanged);
els.sendBtn.addEventListener("click",analyze);
state.randomFramework=pickRandomFramework();
renderModeState();
console.log("Framework Trainer V2.6 STRUCTURED FINAL initialized");
}
init();
</script>
</body>
</html>
