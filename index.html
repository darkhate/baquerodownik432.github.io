<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>框架練習機器人 Gemini AI</title>
<style>
body{font-family:Arial,"Microsoft JhengHei";margin:0}
.header{background:#4285f4;color:#fff;padding:20px;text-align:center;font-size:28px}
.app{display:flex;height:calc(100vh - 80px)}
.left{width:400px;padding:20px;overflow:auto;border-right:1px solid #ddd}
.right{flex:1;padding:20px}
textarea,select{width:100%;padding:12px;font-size:16px}
button{width:45%;height:70px;margin:5px;border-radius:12px;background:#fff;font-size:18px;font-weight:bold}
.start{background:#4285f4;color:white}
.msg{padding:15px;margin:10px;border-radius:12px}
.user{background:#4285f4;color:white}
.ai{background:#eee}
.info{padding:12px;background:#f5f5f5;margin-top:10px}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - Gemini AI</div>

<div class="app">
<div class="left">
<h3>初始論述</h3>
<textarea id="input" rows="5"></textarea>

<h3>練習模式</h3>
<select id="mode" onchange="changeMode()">
<option value="random">隨機一個框架</option>
<option value="all">融合所有框架</option>
<option value="manual">手動選擇框架</option>
</select>

<h3>框架選擇</h3>
<div id="buttons"></div>

<div class="info" id="selected">尚未選擇框架</div>
</div>

<div class="right">
<div id="chat"></div>
<textarea id="reply" rows="3" placeholder="輸入你的回應"></textarea>
<br>
<button class="start" onclick="analyze()">開始分析</button>
</div>
</div>

<script>
const WORKER="https://gemini-framework.baquerodwornik432.workers.dev/";

const FRAMEWORKS={
"崩解":"拆解對方假設",
"識別":"找出核心問題",
"確認":"確認事實與需求",
"壓縮":"濃縮核心重點",
"分割":"拆分複雜問題",
"解構":"分析結構",
"架構":"重新組織",
"重構":"建立新觀點",
"植入":"加入新的思考"
};

let current=null;

Object.keys(FRAMEWORKS).forEach(k=>{
 let b=document.createElement("button");
 b.innerText=k;
 b.onclick=()=>{
  current=k;
  document.getElementById("selected").innerText="目前框架："+k;
 };
 document.getElementById("buttons").appendChild(b);
});

function changeMode(){
 let m=document.getElementById("mode").value;
 if(m==="random"){
  let a=Object.keys(FRAMEWORKS);
  current=a[Math.floor(Math.random()*a.length)];
  document.getElementById("selected").innerText="隨機選擇框架："+current;
 }
 else if(m==="all"){
  current="全部9個框架";
  document.getElementById("selected").innerText="使用框架：全部9個框架";
 }
 else{
  current=null;
  document.getElementById("selected").innerText="尚未選擇框架";
 }
}

function add(t,c){
 let d=document.createElement("div");
 d.className="msg "+c;
 d.innerText=t;
 document.getElementById("chat").appendChild(d);
}

async function analyze(){

let input=document.getElementById("input").value.trim();

if(!input){alert("請輸入初始論述");return;}
if(!current){alert("請選擇框架");return;}

add("使用框架："+current,"user");

let prompt=`你是溝通框架訓練AI。
初始論述：
${input}
使用框架：
${current}
請分析此論述。`;

try{

let res=await fetch(WORKER,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{
role:"user",
parts:[{text:prompt}]
}]
})
});

let data=await res.json();

add(data.text || data.error || "AI沒有回覆","ai");

}catch(e){
add("錯誤："+e.message,"ai");
}

}
</script>
</body>
</html>
