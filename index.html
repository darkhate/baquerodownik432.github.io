<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>框架練習機器人 - Gemini AI</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial}
body{margin:0;background:#eef2ff}.header{background:#467df5;color:white;text-align:center;padding:25px;font-size:28px;font-weight:bold}
.status{padding:12px;color:#07945b;background:white}.app{display:flex;height:calc(100vh - 120px);background:white}
.left{width:340px;padding:15px;border-right:1px solid #ddd;overflow:auto}.right{flex:1;display:flex;flex-direction:column}
textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fbtn{height:65px;background:white;cursor:pointer}
.chat{flex:1;overflow:auto;padding:20px;background:#fafafa}.msg{padding:12px;border-radius:12px;margin:10px;max-width:80%}.user{background:#4285f4;color:white;margin-left:auto}.ai{background:#eee}
.bottom{display:flex;gap:10px;padding:15px}.send{width:100px;background:#4285f4;color:white;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - Gemini AI</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>
<div class="app">
<div class="left">
<h3>初始論述</h3>
<textarea id="topic" placeholder="輸入對方說的話"></textarea>
<h3>練習模式</h3>
<select id="mode">
<option value="single">單個框架</option>
<option value="random">隨機一個框架</option>
<option value="fusion">融合所有框架</option>
</select>
<h3>框架選擇</h3>
<div class="frameworks" id="buttons"></div>
</div>
<div class="right">
<div class="chat" id="chat">選擇框架並輸入回應開始對話</div>
<div class="bottom">
<textarea id="input" placeholder="輸入你的回應"></textarea>
<button class="send" onclick="send()">發送</button>
</div>
</div>
</div>
<script>
const WORKER="https://gemini-framework.baquerodownik432.workers.dev/api/chat";
const FRAMEWORKS={
"崩解":"拆解對方假設",
"識別":"找出核心問題",
"確認":"確認需求與事實",
"壓縮":"濃縮重點",
"分割":"拆分問題",
"解構":"分析結構",
"架構":"重新組織",
"重構":"建立新觀點",
"植入":"加入新思考"
};
let current=null;
let history=[];

const btn=document.getElementById("buttons");
Object.keys(FRAMEWORKS).forEach(k=>{
 let b=document.createElement("button");
 b.className="fbtn";
 b.innerText=k;
 b.onclick=()=>{current=k;};
 btn.appendChild(b);
});

function add(text,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=text;
 document.getElementById("chat").appendChild(d);
 document.getElementById("chat").scrollTop=99999;
}

async function send(){
 let input=document.getElementById("input");
 let text=input.value.trim();
 if(!text)return;

 let mode=document.getElementById("mode").value;

 if(mode==="random"){
   let keys=Object.keys(FRAMEWORKS);
   current=keys[Math.floor(Math.random()*keys.length)];
 }
 if(mode==="fusion") current="融合所有框架";

 if(!current){
   alert("請先選擇框架");
   return;
 }

 add(text,"user");
 input.value="";

 let prompt=`你是一個溝通訓練AI。
目前使用框架:${current}
對方論述:${document.getElementById("topic").value}
使用者回應:${text}
請依照框架提供高品質回覆與分析。`;

 let loading=document.createElement("div");
 loading.className="msg ai";
 loading.innerText="AI思考中...";
 document.getElementById("chat").appendChild(loading);

 try{
  let res=await fetch(WORKER,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    contents:[{role:"user",parts:[{text:prompt}]}]
   })
  });

  let data=await res.json();
  loading.remove();
  add(data.text||"AI沒有回覆","ai");

 }catch(e){
  loading.remove();
  add("錯誤:"+e.message,"ai");
 }
}
</script>
</body>
</html>
