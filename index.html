<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>框架練習機器人 - AI V2.5.3 WAIT-UNTIL-ANSWER FINAL</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial,sans-serif}
:root{--primary:#4285f4;--border:#d9dde5;--muted:#6b7280}
html,body{margin:0;height:100%;background:#eef2ff;color:#222}body{overflow:hidden}
.header{height:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#3f80ee,#5e7fe9);color:#fff;font-size:30px;font-weight:700}
.status{height:54px;padding:15px 20px;background:#fff;color:#07945b;border-bottom:1px solid #e5e7eb;font-size:16px}
.app{height:calc(100vh - 146px);display:flex;background:#fff}.left{width:420px;min-width:340px;padding:18px 20px 30px;border-right:1px solid var(--border);overflow-y:auto}.right{flex:1;min-width:0;display:flex;flex-direction:column}
h3{margin:14px 0 10px;font-size:20px}textarea,select{width:100%;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;padding:12px 14px;background:#fff}textarea:focus,select:focus{outline:2px solid rgba(66,133,244,.18);border-color:var(--primary)}#topic{min-height:110px;resize:vertical}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.fbtn{height:68px;border-radius:10px;background:#fff;font-size:17px;font-weight:700;cursor:pointer;border:2px solid;transition:.12s}.fbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.fbtn[data-name="崩解"]{color:#ff3b3b;border-color:#ff3b3b}.fbtn[data-name="識別"]{color:#7c3aed;border-color:#7c3aed}.fbtn[data-name="確認"]{color:#f59e0b;border-color:#f59e0b}.fbtn[data-name="壓縮"]{color:#10b981;border-color:#10b981}.fbtn[data-name="分割"]{color:#06b6d4;border-color:#06b6d4}.fbtn[data-name="解構"]{color:#d946ef;border-color:#d946ef}.fbtn[data-name="架構"]{color:#ec4899;border-color:#ec4899}.fbtn[data-name="重構"]{color:#ef4444;border-color:#ef4444}.fbtn[data-name="植入"]{color:#65a30d;border-color:#65a30d}.fbtn.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.selected{margin-top:14px;padding:12px 14px;background:#f3f4f6;border-radius:10px;line-height:1.5;min-height:46px}.hint{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
.chat{flex:1;min-height:0;overflow-y:auto;padding:22px 28px;background:#fafafa}.empty{color:#9ca3af;text-align:center;margin-top:70px;font-size:17px}.msg{max-width:86%;white-space:pre-wrap;line-height:1.65;padding:14px 16px;margin:10px 0;border-radius:14px;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:var(--primary);color:#fff}.msg.ai{margin-right:auto;background:#ececec;color:#111}.msg.error{margin-right:auto;background:#fee2e2;color:#991b1b}
.bottom{border-top:1px solid #e5e7eb;background:#fff;padding:16px 20px;display:flex;gap:12px;align-items:stretch}#reply{min-height:82px;resize:vertical}.send{width:150px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:calc(100vh - 146px);flex-direction:column}.left{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--border)}.right{min-height:600px}.bottom{flex-direction:column}.send{width:100%;height:56px}}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - AI</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>
<div class="app">
  <aside class="left">
    <h3>初始論述</h3>
    <textarea id="topic" placeholder="輸入對方說的話…"></textarea>
    <h3>練習模式</h3>
    <select id="mode">
      <option value="random">隨機一個框架</option>
      <option value="all">融合所有框架</option>
      <option value="manual">手動選擇框架</option>
    </select>
    <h3>框架選擇</h3>
    <div class="frameworks" id="buttons"></div>
    <div class="selected" id="selected"></div>
    <div class="hint" id="modeHint"></div>
  </aside>
  <main class="right">
    <div class="chat" id="chat"><div class="empty" id="empty">請輸入初始論述並開始分析</div></div>
    <div class="bottom">
      <textarea id="reply" placeholder="輸入你的回應（可留空）"></textarea>
      <button class="send" id="sendBtn" type="button">開始分析</button>
    </div>
  </main>
</div>
<script>
"use strict";
const WORKER="https://gemini-framework.baquerodwornik432.workers.dev/";
const FRAMEWORKS={
"崩解":"拆解對方的前提、假設與隱含因果，找出可以被重新檢視的基礎。",
"識別":"辨識真正核心問題、關鍵矛盾與對話焦點。",
"確認":"確認事實、需求、限制、定義與雙方共同認知。",
"壓縮":"把複雜論述濃縮成少數核心命題，降低溝通成本。",
"分割":"把大型或混合問題拆成可個別處理的小問題。",
"解構":"分析論述的組成、關係、因果、角色與權責結構。",
"架構":"重新排列資訊與論點，建立更清楚的溝通結構。",
"重構":"改變原本問題的看法或定義，建立新的理解與方案。",
"植入":"在不破壞原對話的前提下，引入新的判準、資訊或思考方向。"
};
const state={manualFramework:null,randomFramework:null,busy:false};
const INITIAL_RETRY_DELAY_MS=1500;
const MAX_RETRY_DELAY_MS=15000;
const REQUEST_TIMEOUT_MS=60000;
const els={topic:document.getElementById("topic"),mode:document.getElementById("mode"),buttons:document.getElementById("buttons"),selected:document.getElementById("selected"),modeHint:document.getElementById("modeHint"),chat:document.getElementById("chat"),empty:document.getElementById("empty"),reply:document.getElementById("reply"),sendBtn:document.getElementById("sendBtn")};
function frameworkNames(){return Object.keys(FRAMEWORKS)}
function pickRandomFramework(){const names=frameworkNames();return names[Math.floor(Math.random()*names.length)]}
function clearActiveButtons(){document.querySelectorAll(".fbtn").forEach(btn=>btn.classList.remove("active"))}
function setActiveButton(name){clearActiveButtons();document.querySelectorAll(".fbtn").forEach(btn=>{if(btn.dataset.name===name)btn.classList.add("active")})}
function buildFrameworkButtons(){for(const name of frameworkNames()){const btn=document.createElement("button");btn.type="button";btn.className="fbtn";btn.dataset.name=name;btn.textContent=name;btn.addEventListener("click",()=>{state.manualFramework=name;els.mode.value="manual";renderModeState()});els.buttons.appendChild(btn)}}
function renderModeState(){
const mode=els.mode.value;

if(mode==="manual"){
state.randomFramework=null;
if(state.manualFramework){
setActiveButton(state.manualFramework);
els.selected.textContent="目前框架："+state.manualFramework;
els.modeHint.textContent="手動模式：開始分析時只使用你點選的框架。";
}else{
clearActiveButtons();
els.selected.textContent="手動模式：尚未選擇框架";
els.modeHint.textContent="請從上方 9 個框架中選擇一個。";
}
return;
}

if(mode==="random"){
if(!state.randomFramework){
state.randomFramework=pickRandomFramework();
}
setActiveButton(state.randomFramework);
els.selected.textContent="隨機選擇框架："+state.randomFramework;
els.modeHint.textContent="隨機模式：已自動選定框架，不需要再手動點選。";
return;
}

if(mode==="all"){
state.randomFramework=null;
clearActiveButtons();
els.selected.textContent="使用框架：全部9個框架";
els.modeHint.textContent="融合模式：不需要手動選擇框架，9 個框架會在同一個 API 請求中一起分析。";
return;
}
}
function onModeChanged(){const mode=els.mode.value;state.randomFramework=mode==="random"?pickRandomFramework():null;renderModeState()}
function resolveFrameworkForAnalysis(){
const mode=els.mode.value;

if(mode==="manual"){
if(!state.manualFramework){
throw new Error("請選擇框架");
}
return{
mode:"manual",
display:state.manualFramework,
promptText:`${state.manualFramework}：${FRAMEWORKS[state.manualFramework]}`
};
}

if(mode==="random"){
if(!state.randomFramework){
state.randomFramework=pickRandomFramework();
renderModeState();
}
return{
mode:"random",
display:state.randomFramework,
promptText:`${state.randomFramework}：${FRAMEWORKS[state.randomFramework]}`
};
}

if(mode==="all"){
return{
mode:"all",
display:"全部9個框架",
promptText:frameworkNames()
.map(name=>`${name}：${FRAMEWORKS[name]}`)
.join("\n")
};
}

throw new Error("未知的練習模式");
}
function addMessage(text,type="ai"){if(els.empty){els.empty.remove();els.empty=null}const div=document.createElement("div");div.className="msg "+type;div.textContent=text;els.chat.appendChild(div);els.chat.scrollTop=els.chat.scrollHeight;return div}
function setBusy(busy){
state.busy=busy;
els.sendBtn.disabled=busy;
els.sendBtn.textContent=busy?"分析中…":"開始分析";
els.mode.disabled=busy;
document.querySelectorAll(".fbtn").forEach(btn=>btn.disabled=busy);
}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

function extractAnswer(data){
return data?.text
||data?.choices?.[0]?.message?.content
||data?.candidates?.[0]?.content?.parts?.[0]?.text
||"";
}

function isPlaceholderAnswer(text){
const value=String(text||"").trim();
if(!value)return true;
const placeholders=[
"AI沒有回覆",
"AI沒有產生回覆",
"Gemini沒有回覆",
"Gemini沒有產生內容",
"GPT沒有回覆",
"無回覆"
];
return placeholders.some(item=>value===item||value.includes(item));
}

function getApiError(data){
const candidates=[
data?.error?.message,
typeof data?.error==="string"?data.error:null,
data?.message,
data?.detail
].filter(Boolean);

const text=String(data?.text||"").trim();
if(
text.startsWith("OpenAI API錯誤：")||
text.startsWith("Gemini API錯誤：")||
text.startsWith("Worker錯誤：")
){
candidates.unshift(text);
}

return candidates.length?String(candidates[0]):"";
}

function isFatalApiError(message,status){
const text=String(message||"").toLowerCase();

const fatalHints=[
"no credits remaining",
"insufficient_quota",
"prepayment credits are depleted",
"billing",
"invalid api key",
"incorrect api key",
"authentication",
"unauthorized",
"user location is not supported",
"model",
"not available to new users",
"permission denied"
];

if(status===401||status===403)return true;
return fatalHints.some(hint=>text.includes(hint));
}

function formatRetryStatus(attempt,delayMs,reason){
const seconds=Math.max(1,Math.round(delayMs/1000));
return `AI 尚未產生有效回答，正在持續等待。\n第 ${attempt} 次嘗試未成功，${seconds} 秒後自動重試…${reason?`\n原因：${reason}`:""}`;
}

async function fetchWithTimeout(url,options,timeoutMs){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeoutMs);
try{
return await fetch(url,{...options,signal:controller.signal});
}finally{
clearTimeout(timer);
}
}
async function analyze(){
if(state.busy)return;

const topic=els.topic.value.trim();
const userReply=els.reply.value.trim();

if(!topic){
alert("請輸入初始論述");
els.topic.focus();
return;
}

let resolved;
try{
resolved=resolveFrameworkForAnalysis();
}catch(error){
alert(error.message);
return;
}

if(resolved.mode==="random"){
els.selected.textContent="隨機選擇框架："+resolved.display;
setActiveButton(resolved.display);
}else if(resolved.mode==="all"){
els.selected.textContent="使用框架：全部9個框架";
clearActiveButtons();
}else{
els.selected.textContent="目前框架："+resolved.display;
setActiveButton(resolved.display);
}

addMessage(
"使用框架："+resolved.display+
"\n\n原始論述：\n"+topic+
(userReply?"\n\n我的回應：\n"+userReply:""),
"user"
);

const modeLabel={
manual:"手動單框架",
random:"隨機單框架",
all:"融合全部9個框架"
}[resolved.mode];

const prompt=`你是一個繁體中文的溝通框架訓練 AI。

【任務】
針對下方「初始論述」，依指定框架進行分析，並協助使用者練習實際溝通。

【練習模式】
${modeLabel}

【使用框架】
${resolved.promptText}

【初始論述】
${topic}

【使用者目前回應】
${userReply||"（尚未提供，請先示範一個可直接使用的回應）"}

【輸出要求】
1. 先指出本次實際使用的框架。
2. 說明此框架如何解讀初始論述。
3. 指出使用者應該注意的核心問題、假設、資訊缺口或溝通風險。
4. 提供一段自然、可直接說出口的建議回應。
5. 如果使用者已提供自己的回應，請具體指出優點與可改善處。
6. 使用繁體中文，不要只給抽象理論。

如果模式是「融合全部9個框架」，請在同一份回答中整合九個框架，不要要求前端分別呼叫九次 API。`;

setBusy(true);
const loading=addMessage("AI 分析中，正在等待有效回答…","ai");

try{
let attempt=0;
let retryDelay=INITIAL_RETRY_DELAY_MS;

while(true){
attempt+=1;

if(attempt===1){
loading.textContent="AI 分析中，正在等待有效回答…";
}else{
loading.textContent=`AI 正在重新嘗試…（第 ${attempt} 次）`;
}

let response=null;
let data={};
let rawText="";

try{
response=await fetchWithTimeout(
WORKER,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{
role:"user",
parts:[{text:prompt}]
}]
})
},
REQUEST_TIMEOUT_MS
);
}catch(fetchError){
const reason=fetchError?.name==="AbortError"
?"本次請求逾時"
:(fetchError?.message||"連線失敗");

loading.textContent=formatRetryStatus(attempt,retryDelay,reason);
await sleep(retryDelay);
retryDelay=Math.min(retryDelay*2,MAX_RETRY_DELAY_MS);
continue;
}

try{
rawText=await response.text();
data=rawText?JSON.parse(rawText):{};
}catch(parseError){
loading.textContent=formatRetryStatus(
attempt,
retryDelay,
`Worker 回傳格式異常（HTTP ${response.status}）`
);
await sleep(retryDelay);
retryDelay=Math.min(retryDelay*2,MAX_RETRY_DELAY_MS);
continue;
}

const apiError=getApiError(data);

if(!response.ok){
const message=apiError||`HTTP ${response.status}`;

if(isFatalApiError(message,response.status)){
throw new Error(message);
}

loading.textContent=formatRetryStatus(attempt,retryDelay,message);
await sleep(retryDelay);
retryDelay=Math.min(retryDelay*2,MAX_RETRY_DELAY_MS);
continue;
}

if(apiError){
if(isFatalApiError(apiError,response.status)){
throw new Error(apiError);
}

loading.textContent=formatRetryStatus(attempt,retryDelay,apiError);
await sleep(retryDelay);
retryDelay=Math.min(retryDelay*2,MAX_RETRY_DELAY_MS);
continue;
}

const answer=extractAnswer(data);

if(answer&&!isPlaceholderAnswer(answer)){
loading.className="msg ai";
loading.textContent=String(answer).trim();
break;
}

console.warn(`第 ${attempt} 次沒有取得有效 AI 回答：`,data);

loading.textContent=formatRetryStatus(
attempt,
retryDelay,
"AI 回傳空內容或暫時性占位訊息"
);

await sleep(retryDelay);
retryDelay=Math.min(retryDelay*2,MAX_RETRY_DELAY_MS);
}

}catch(error){
loading.className="msg error";
loading.textContent="無法繼續請求："+(error?.message||String(error));
console.error("分析失敗：",error);
}finally{
setBusy(false);
}
}

function init(){buildFrameworkButtons();els.mode.addEventListener("change",onModeChanged);els.sendBtn.addEventListener("click",analyze);state.randomFramework=pickRandomFramework();renderModeState();console.log("Framework Trainer V2.5.3 WAIT-UNTIL-ANSWER FINAL initialized");console.log("Worker:",WORKER)}
init();
</script>
</body>
</html>
