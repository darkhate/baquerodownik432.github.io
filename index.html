<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>框架練習機器人 - Gemini AI V2.3.5 FINAL</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial}
body{margin:0;background:#eef2ff}
.header{background:#467df5;color:#fff;text-align:center;padding:24px;font-size:30px;font-weight:bold}
.status{padding:12px;background:#fff;color:#07945b}
.app{display:flex;height:calc(100vh - 120px);background:#fff}
.left{width:420px;padding:18px;border-right:1px solid #ddd;overflow:auto}
.right{flex:1;display:flex;flex-direction:column}
textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fbtn{height:70px;background:#fff;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;border:2px solid}
.fbtn:nth-child(1){color:#f33;border-color:#f33}.fbtn:nth-child(2){color:#7c3aed;border-color:#7c3aed}
.fbtn:nth-child(3){color:#f59e0b;border-color:#f59e0b}.fbtn:nth-child(4){color:#10b981;border-color:#10b981}
.fbtn:nth-child(5){color:#06b6d4;border-color:#06b6d4}.fbtn:nth-child(6){color:#d946ef;border-color:#d946ef}
.fbtn:nth-child(7){color:#ec4899;border-color:#ec4899}.fbtn:nth-child(8){color:#ef4444;border-color:#ef4444}
.fbtn:nth-child(9){color:#65a30d;border-color:#65a30d}
.fbtn.active{background:#467df5;color:white}
.selected{margin-top:12px;background:#f1f1f1;padding:12px;border-radius:8px}
.chat{flex:1;padding:20px;overflow:auto;background:#fafafa}
.msg{padding:14px;border-radius:12px;margin:10px;white-space:pre-wrap}
.user{background:#4285f4;color:white;margin-left:auto;max-width:80%}
.ai{background:#eee;max-width:85%}
.bottom{display:flex;gap:10px;padding:15px}
.send{width:130px;background:#467df5;color:#fff;border:0;border-radius:10px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - Gemini AI</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>

<div class="app">
<div class="left">
<h3>初始論述</h3>
<textarea id="topic" placeholder="輸入對方說的話"></textarea>

<h3>練習模式</h3>
<select id="mode" onchange="updateMode()">
<option value="single">單個框架</option>
<option value="random">隨機一個框架</option>
<option value="fusion">融合所有框架</option>
</select>

<h3>框架選擇</h3>
<div class="frameworks" id="buttons"></div>
<div class="selected" id="selected">單一框架：請選擇框架</div>
</div>

<div class="right">
<div class="chat" id="chat">請輸入初始論述並選擇框架開始分析</div>
<div class="bottom">
<textarea id="input" placeholder="輸入你的回應（可留空）"></textarea>
<button class="send" onclick="send()">開始分析</button>
</div>
</div>
</div>

<script>
console.log("V2.3.5 FINAL Loaded");

const WORKER="https://gemini-framework.baquerodwornik432.workers.dev/";

const FRAMEWORKS={
"崩解":"拆解對方假設",
"識別":"找出核心問題",
"確認":"確認事實與需求",
"壓縮":"濃縮核心重點",
"分割":"拆分複雜問題",
"解構":"分析結構",
"架構":"重新組織",
"重構":"建立新觀點",
"植入":"加入新的思考"
};

let current=null;

Object.keys(FRAMEWORKS).forEach(k=>{
 let b=document.createElement("button");
 b.className="fbtn";
 b.innerText=k;
 b.onclick=()=>{
   current=k;
   document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
   b.classList.add("active");
   document.getElementById("selected").innerText="目前框架："+k;
 };
 document.getElementById("buttons").appendChild(b);
});

function updateMode(){
 let mode=document.getElementById("mode").value;

 if(mode==="random"){
   document.getElementById("selected").innerText="隨機模式：分析時自動選擇框架";
 }
 else if(mode==="fusion"){
   document.getElementById("selected").innerText="融合模式：使用全部9個框架";
 }
 else{
   document.getElementById("selected").innerText=current?"目前框架："+current:"單一框架：請選擇框架";
 }
}

function add(text,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=text;
 document.getElementById("chat").appendChild(d);
}

async function send(){

 let mode=document.getElementById("mode").value;
 let framework=current;

 if(mode==="random"){
   let keys=Object.keys(FRAMEWORKS);
   framework=keys[Math.floor(Math.random()*keys.length)];
   document.getElementById("selected").innerText="隨機選擇框架："+framework;
 }

 if(mode==="fusion"){
   framework="全部9個框架";
   document.getElementById("selected").innerText="融合模式：全部9個框架";
 }

 if(mode==="single" && !framework){
   alert("請選擇框架");
   return;
 }

 let topic=document.getElementById("topic").value.trim();
 if(!topic){
   alert("請輸入初始論述");
   return;
 }

 let text=document.getElementById("input").value.trim() || "請分析此論述";

 add("使用框架："+framework,"user");

 let prompt=`你是溝通框架訓練AI。

初始論述：
${topic}

模式：
${mode}

使用框架：
${framework}

使用者補充：
${text}

請依照框架分析：
1. 核心問題
2. 隱含假設
3. 分析拆解
4. 建議回應方式`;

 try{
   let res=await fetch(WORKER,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       contents:[{
        role:"user",
        parts:[{text:prompt}]
       }]
     })
   });

   let data=await res.json();
   add(data.text || "AI沒有回覆","ai");

 }catch(e){
   add("錯誤："+e.message,"ai");
 }
}
</script>
</body>
</html>
