<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>框架練習機器人 - AI V2.9.3 DYNAMIC-MODEL-DISCOVERY</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial,sans-serif}
:root{--primary:#4285f4;--border:#d9dde5;--muted:#6b7280}
html,body{margin:0;height:100%;background:#eef2ff;color:#222}
body{overflow:hidden}
.header{height:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#3f80ee,#5e7fe9);color:#fff;font-size:30px;font-weight:700}
.status{height:54px;padding:15px 20px;background:#fff;color:#07945b;border-bottom:1px solid #e5e7eb;font-size:16px}
.app{height:calc(100vh - 146px);display:flex;background:#fff}
.left{width:420px;min-width:340px;padding:18px 20px 30px;border-right:1px solid var(--border);overflow-y:auto}
.right{flex:1;min-width:0;display:flex;flex-direction:column}
h3{margin:14px 0 10px;font-size:20px}
textarea,select{width:100%;border:1px solid #cfd4dc;border-radius:10px;font-size:16px;padding:12px 14px;background:#fff}
textarea:focus,select:focus{outline:2px solid rgba(66,133,244,.18);border-color:var(--primary)}
#topic{min-height:110px;resize:vertical}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fbtn{height:68px;border-radius:10px;background:#fff;font-size:17px;font-weight:700;cursor:pointer;border:2px solid;transition:.12s}
.fbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.fbtn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.fbtn[data-name="崩解"]{color:#ff3b3b;border-color:#ff3b3b}
.fbtn[data-name="壓縮"]{color:#10b981;border-color:#10b981}
.fbtn[data-name="分割"]{color:#06b6d4;border-color:#06b6d4}
.fbtn[data-name="重塑"]{color:#ec4899;border-color:#ec4899}
.fbtn[data-name="植入"]{color:#65a30d;border-color:#65a30d}
.fbtn.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.selected{margin-top:14px;padding:12px 14px;background:#f3f4f6;border-radius:10px;line-height:1.5;min-height:46px}
.progress{margin-top:10px;padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;line-height:1.55;font-size:14px;color:#4b5563}
.hint{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
.chat{flex:1;min-height:0;overflow-y:auto;padding:22px 28px;background:#fafafa}
.empty{color:#9ca3af;text-align:center;margin-top:70px;font-size:17px}
.msg{max-width:86%;white-space:pre-wrap;line-height:1.65;padding:14px 16px;margin:10px 0;border-radius:14px;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--primary);color:#fff}
.msg.ai{margin-right:auto;background:#ececec;color:#111}
.msg.step{margin-right:auto;background:#e8f0fe;color:#173b73;border:1px solid #c7dcff}
.msg.hintmsg{margin-right:auto;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.msg.ok{margin-right:auto;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
.msg.error{margin-right:auto;background:#fee2e2;color:#991b1b}
.bottom{border-top:1px solid #e5e7eb;background:#fff;padding:16px 20px;display:flex;gap:12px;align-items:stretch}
#reply{min-height:82px;resize:vertical}
.send,.hintbtn{border:0;border-radius:10px;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.send{width:150px;background:var(--primary)}
.hintbtn{width:170px;background:#f59e0b}
.send:disabled,.hintbtn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:calc(100vh - 146px);flex-direction:column}.left{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--border)}.right{min-height:650px}.bottom{flex-direction:column}.send,.hintbtn{width:100%;height:56px}}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - AI</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>

<div class="app">
<aside class="left">
<h3>初始論述</h3>
<textarea id="topic" placeholder="輸入對方說的話…"></textarea>

<h3>練習模式</h3>
<select id="mode">
<option value="random">隨機一個框架</option>
<option value="all">融合所有5個框架</option>
<option value="manual">手動選擇框架</option>
</select>

<h3>框架選擇（5個）</h3>
<div class="frameworks" id="buttons"></div>
<div class="selected" id="selected"></div>
<div class="progress" id="progress">尚未開始練習。</div>
<div class="hint" id="modeHint"></div>
</aside>

<main class="right">
<div class="chat" id="chat">
<div class="empty" id="empty">請輸入初始論述並開始分析。AI 只負責出題、判斷方向；分析步驟由你回答。</div>
</div>
<div class="bottom">
<textarea id="reply" placeholder="輸入你的回應（開始後在這裡回答目前步驟）"></textarea>
<button class="send" id="sendBtn" type="button">開始分析</button>
<button class="hintbtn" id="hintBtn" type="button" disabled>我答不出來，給提示</button>
</div>
</main>
</div>

<script>
"use strict";

const WORKER="https://gemini-framework.baquerodwornik432.workers.dev/";

const COURSE={
"崩解":{
description:"辨識對方建立的語言框架、假設或前提，然後直接擊破。",
steps:[
{name:"框架識別",goal:"抓出對方話語背後的隱含框架、假設或等號關係。",question:"你認為這句話背後隱藏了什麼框架、假設或『等號關係』？"},
{name:"框架確認",goal:"確認自己是否正確理解對方的框架，避免拆錯方向。",question:"你會怎麼問對方，確認自己沒有抓錯他的框架？"},
{name:"框架拆除",goal:"指出框架漏洞，讓原本的邏輯或等號關係失效。",question:"你會怎麼回，讓這個框架的邏輯失效？"}
]},
"壓縮":{
description:"把大量論點、資訊、角度濃縮在一瞬間拋出，主導對話節奏。",
steps:[
{name:"聚焦目標",goal:"先明確設定這次溝通真正要達成的核心目標。",question:"這次你真正想達成的核心目標是什麼？請先用一句話說清楚。"},
{name:"多重切角",goal:"從多個角度建立支撐，而不是只靠單一理由。",question:"你可以從哪些 2～3 個不同角度支持這個目標？"},
{name:"飽和攻擊",goal:"把前面的目標與切角整合成連續、密集、難以逐一拆解的回應。",question:"把前面整理的內容整合成一段你會直接說出口的回應。"}
]},
"分割":{
description:"把問題切片，抽離不利部分，專注在能掌控與能證明的區塊。",
steps:[
{name:"價值確認",goal:"先承認或確認對方重視的價值，避免直接對撞。",question:"你會先確認對方重視的什麼價值？你會怎麼說？"},
{name:"問題切割",goal:"把模糊或全面性的指控切成可確認、可處理的具體區塊。",question:"接下來你要把問題切成哪個具體區塊來談？"},
{name:"信任重建",goal:"在切割問題後，提出下一步或證據，重新建立信任。",question:"最後你會怎麼把信任重新接回來？"}
]},
"重塑":{
description:"重新定義問題本質，讓對方跳脫原本框架，進入新的理解方式。",
steps:[
{name:"解構",goal:"拆出問題元素，分清楚事實、誤解、情緒與真正問題。",question:"先拆開這句話：裡面有哪些事實、情緒、誤解或真正問題？"},
{name:"架構",goal:"把問題重新整理成清楚的論述或對話結構。",question:"你會怎麼重新排列這些元素，讓對話變得清楚？"},
{name:"重構",goal:"重新定義問題，帶入新的理解方式與回應方向。",question:"現在你要把原本的問題重構成什麼新的理解方式？你會怎麼說？"}
]},
"植入":{
description:"透過鋪墊、故事與引導語言，把新的觀點種進對方思維。",
steps:[
{name:"認知鋪墊",goal:"先建立共同經驗或共同語境，降低對新觀點的抵抗。",question:"你會先用什麼共同經驗、故事或情境做鋪墊？"},
{name:"概念灌注",goal:"把新的觀點自然放進對方理解中，不用強迫式說服。",question:"接下來你要植入的核心概念是什麼？你會怎麼自然地說出來？"},
{name:"無壓收尾",goal:"留下選擇空間與正向印象，不強迫對方立刻接受。",question:"最後你會怎麼收尾，讓對方有選擇空間但保留這個觀點？"}
]}
};

const FRAMEWORK_ORDER=["崩解","壓縮","分割","重塑","植入"];

const state={
active:false,
busy:false,
manualFramework:null,
randomFramework:null,
queue:[],
frameworkIndex:0,
stepIndex:0,
attempt:0,
answers:{}
};

const RETRY_START_MS=1500;
const RETRY_MAX_MS=15000;
const REQUEST_TIMEOUT_MS=60000;

const els={
topic:document.getElementById("topic"),
mode:document.getElementById("mode"),
buttons:document.getElementById("buttons"),
selected:document.getElementById("selected"),
progress:document.getElementById("progress"),
modeHint:document.getElementById("modeHint"),
chat:document.getElementById("chat"),
empty:document.getElementById("empty"),
reply:document.getElementById("reply"),
sendBtn:document.getElementById("sendBtn"),
hintBtn:document.getElementById("hintBtn")
};

function pickRandomFramework(){
return FRAMEWORK_ORDER[Math.floor(Math.random()*FRAMEWORK_ORDER.length)];
}

function clearActiveButtons(){
document.querySelectorAll(".fbtn").forEach(btn=>btn.classList.remove("active"));
}

function setActiveButton(name){
clearActiveButtons();
document.querySelectorAll(".fbtn").forEach(btn=>{
if(btn.dataset.name===name)btn.classList.add("active");
});
}

function buildFrameworkButtons(){
for(const name of FRAMEWORK_ORDER){
const btn=document.createElement("button");
btn.type="button";
btn.className="fbtn";
btn.dataset.name=name;
btn.textContent=name;
btn.addEventListener("click",()=>{
if(state.active)return;
state.manualFramework=name;
els.mode.value="manual";
renderModeState();
});
els.buttons.appendChild(btn);
}
}

function renderModeState(){
if(state.active)return;
const mode=els.mode.value;

if(mode==="manual"){
state.randomFramework=null;
if(state.manualFramework){
setActiveButton(state.manualFramework);
els.selected.textContent="目前框架："+state.manualFramework;
els.modeHint.textContent="手動模式：開始後依序由你回答這個框架的三個分析步驟。";
}else{
clearActiveButtons();
els.selected.textContent="手動模式：尚未選擇框架";
els.modeHint.textContent="請從上方 5 個框架中選擇一個。";
}
return;
}

if(mode==="random"){
if(!state.randomFramework)state.randomFramework=pickRandomFramework();
setActiveButton(state.randomFramework);
els.selected.textContent="隨機選擇框架："+state.randomFramework;
els.modeHint.textContent="隨機模式：框架已自動選定；分析步驟仍由你自己回答。";
return;
}

if(mode==="all"){
state.randomFramework=null;
clearActiveButtons();
els.selected.textContent="使用框架：全部5個框架";
els.modeHint.textContent="全部模式：依序完成崩解、壓縮、分割、重塑、植入；AI 不代答分析步驟。";
}
}

function onModeChanged(){
if(state.active)return;
state.randomFramework=els.mode.value==="random"?pickRandomFramework():null;
renderModeState();
}

function resolveQueue(){
const mode=els.mode.value;

if(mode==="manual"){
if(!state.manualFramework)throw new Error("請選擇框架");
return [state.manualFramework];
}

if(mode==="random"){
if(!state.randomFramework)state.randomFramework=pickRandomFramework();
return [state.randomFramework];
}

if(mode==="all"){
return [...FRAMEWORK_ORDER];
}

throw new Error("未知的練習模式");
}

function currentFramework(){return state.queue[state.frameworkIndex]}
function currentStep(){return COURSE[currentFramework()].steps[state.stepIndex]}

function addMessage(text,type="ai"){
if(els.empty){els.empty.remove();els.empty=null}
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
els.chat.appendChild(div);
els.chat.scrollTop=els.chat.scrollHeight;
return div;
}

function setBusy(busy){
state.busy=busy;
els.sendBtn.disabled=busy;
els.hintBtn.disabled=!state.active||busy;
els.mode.disabled=state.active||busy;
els.topic.disabled=state.active||busy;
document.querySelectorAll(".fbtn").forEach(btn=>btn.disabled=state.active||busy);
}

function renderProgress(){
if(!state.active){
els.progress.textContent="尚未開始練習。";
return;
}
const fw=currentFramework();
const step=currentStep();
els.progress.textContent=
`進度：框架 ${state.frameworkIndex+1}/${state.queue.length}｜${fw}｜步驟 ${state.stepIndex+1}/${COURSE[fw].steps.length}：${step.name}`;
}

function announceStep(){
const fw=currentFramework();
const step=currentStep();
setActiveButton(fw);
els.selected.textContent="目前框架："+fw;
renderProgress();

addMessage(
`【${fw}｜${step.name}】\n${step.question}`,
"step"
);

els.reply.value="";
els.reply.focus();
}

function buildHistory(){
const fw=currentFramework();
return Object.entries(state.answers[fw]||{}).map(([step,answer])=>({step,answer}));
}

function startPractice(){
const topic=els.topic.value.trim();
if(!topic){
alert("請輸入初始論述");
els.topic.focus();
return;
}

let queue;
try{
queue=resolveQueue();
}catch(error){
alert(error.message);
return;
}

state.active=true;
state.queue=queue;
state.frameworkIndex=0;
state.stepIndex=0;
state.attempt=0;
state.answers={};

for(const fw of queue)state.answers[fw]={};

els.sendBtn.textContent="送出回答";
els.hintBtn.disabled=false;
setBusy(false);

addMessage(
`使用框架：${queue.length===1?queue[0]:"全部5個框架"}\n\n原始論述：\n${topic}`,
"user"
);

announceStep();
}

function finishPractice(){
const lines=[];
for(const fw of state.queue){
lines.push(`【${fw}】`);
for(const step of COURSE[fw].steps){
const answer=state.answers[fw]?.[step.name];
if(answer)lines.push(`${step.name}：${answer}`);
}
lines.push("");
}

addMessage(
"本輪練習完成。以下只整理你自己的作答，不新增標準答案：\n\n"+lines.join("\n").trim(),
"ok"
);

state.active=false;
state.busy=false;
state.queue=[];
state.frameworkIndex=0;
state.stepIndex=0;
state.attempt=0;

els.sendBtn.textContent="開始分析";
els.hintBtn.disabled=true;
els.mode.disabled=false;
els.topic.disabled=false;
document.querySelectorAll(".fbtn").forEach(btn=>btn.disabled=false);
els.reply.value="";
els.selected.textContent="本輪練習完成";
els.progress.textContent="已完成本輪練習。";
clearActiveButtons();
renderModeState();
}

function advance(){
const fw=currentFramework();

if(state.stepIndex+1<COURSE[fw].steps.length){
state.stepIndex+=1;
state.attempt=0;
announceStep();
return;
}

addMessage(`「${fw}」完成。`,"ok");

if(state.frameworkIndex+1<state.queue.length){
state.frameworkIndex+=1;
state.stepIndex=0;
state.attempt=0;
announceStep();
return;
}

finishPractice();
}

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function fetchWithTimeout(url,options,timeoutMs){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeoutMs);
try{
return await fetch(url,{...options,signal:controller.signal});
}finally{
clearTimeout(timer);
}
}

function fatalError(message,status){
const text=String(message||"").toLowerCase();
if(status===401||status===403)return true;
return [
"gemini_api_key is not configured",
"invalid api key",
"incorrect api key",
"user location is not supported",
"prepayment credits are depleted",
"no credits remaining",
"permission denied",
"authentication",
"unauthorized"
].some(x=>text.includes(x));
}

async function postJsonWithRetry(payload,loading){
let delay=RETRY_START_MS;
let attempt=0;

while(true){
attempt+=1;

try{
const response=await fetchWithTimeout(
WORKER,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
},
REQUEST_TIMEOUT_MS
);

const raw=await response.text();
let data={};

try{
data=raw?JSON.parse(raw):{};
}catch{
throw new Error(`Worker 回傳不是有效 JSON（HTTP ${response.status}）`);
}

if(!response.ok){
const message=data?.error||`HTTP ${response.status}`;
if(fatalError(message,response.status))throw new Error(message);

/*
  Worker 已經先輪完不同模型。
  如果 Google 回傳 retryAfterSeconds，就尊重 Google 的等待時間；
  不再固定 15 秒後重打。
*/
const serverRetrySeconds=Number(data?.retryAfterSeconds||0);
const serverRetryMs=Number.isFinite(serverRetrySeconds)&&serverRetrySeconds>0
?Math.ceil(serverRetrySeconds*1000)
:0;

const waitMs=Math.max(delay,serverRetryMs);
const waitSeconds=Math.max(1,Math.ceil(waitMs/1000));

const tried=Array.isArray(data?.triedModels)&&data.triedModels.length
?`\n已嘗試模型：${data.triedModels.join(" → ")}`
:"";

loading.textContent=`AI 暫時沒有有效回應，${waitSeconds} 秒後自動重試…${tried}\n原因：${message}`;

await sleep(waitMs);

/* 下一輪仍保留指數退避，但 Google 指定的 retry-after 優先 */
delay=Math.min(Math.max(delay*2,waitMs),Math.max(RETRY_MAX_MS,waitMs));
continue;
}

if(data?.model) console.log("Gemini model used:", data.model);
return data;

}catch(error){
if(fatalError(error.message,0))throw error;
loading.textContent=`連線暫時失敗，${Math.round(delay/1000)} 秒後自動重試…\n原因：${error.message}`;
await sleep(delay);
delay=Math.min(delay*2,RETRY_MAX_MS);
}
}
}

async function submitCurrent(){
if(!state.active){
startPractice();
return;
}

if(state.busy)return;

const answer=els.reply.value.trim();
if(!answer){
alert("請回答目前這一步；如果答不出來，可以按「我答不出來，給提示」。");
return;
}

const fw=currentFramework();
const step=currentStep();
state.attempt+=1;

addMessage(answer,"user");
const loading=addMessage("AI 正在判斷你的方向…","ai");
setBusy(true);

try{
const data=await postJsonWithRetry({
action:"evaluate_step",
topic:els.topic.value.trim(),
framework:fw,
step:step.name,
stepGoal:step.goal,
userAnswer:answer,
history:buildHistory(),
attempt:state.attempt
},loading);

if(data?.verdict==="pass"){
state.answers[fw][step.name]=answer;
loading.className="msg ok";
loading.textContent=data?.feedback||"方向正確。";
setBusy(false);
advance();
return;
}

loading.className="msg hintmsg";
loading.textContent=
(data?.feedback||"方向需要調整。")+
(data?.hint?`\n提示：${data.hint}`:"");

setBusy(false);
els.reply.value="";
els.reply.focus();

}catch(error){
loading.className="msg error";
loading.textContent="無法繼續請求："+error.message;
setBusy(false);
}
}

async function requestHint(){
if(!state.active||state.busy)return;

const fw=currentFramework();
const step=currentStep();
const loading=addMessage("正在準備提示…","ai");
setBusy(true);

try{
const data=await postJsonWithRetry({
action:"give_hint",
topic:els.topic.value.trim(),
framework:fw,
step:step.name,
stepGoal:step.goal,
history:buildHistory(),
draft:els.reply.value.trim()
},loading);

loading.className="msg hintmsg";
loading.textContent="提示："+(data?.hint||"先回到目前這一步的目的，再想想你要處理的是哪一個核心點。");
setBusy(false);
els.reply.focus();

}catch(error){
loading.className="msg error";
loading.textContent="無法取得提示："+error.message;
setBusy(false);
}
}

function init(){
buildFrameworkButtons();
els.mode.addEventListener("change",onModeChanged);
els.sendBtn.addEventListener("click",submitCurrent);
els.hintBtn.addEventListener("click",requestHint);

state.randomFramework=pickRandomFramework();
renderModeState();

els.reply.addEventListener("keydown",event=>{
if(event.ctrlKey&&event.key==="Enter"){
event.preventDefault();
submitCurrent();
}
});

console.log("Framework Trainer V2.9.3 DYNAMIC-MODEL-DISCOVERY initialized");
}

init();
</script>
</body>
</html>
