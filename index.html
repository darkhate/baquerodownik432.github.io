<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>框架練習機器人 - Gemini AI V2.3 FINAL</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft JhengHei",Arial}
body{margin:0;background:#eef2ff}
.header{background:#467df5;color:white;text-align:center;padding:25px;font-size:30px;font-weight:bold}
.status{background:white;padding:12px;color:#008f5a}
.container{display:flex;height:calc(100vh - 120px);background:white}
.left{width:360px;padding:15px;border-right:1px solid #ddd;overflow:auto}
.right{flex:1;display:flex;flex-direction:column}
textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc}
.frameworks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtn{height:60px;border-radius:8px;background:white;cursor:pointer}
.fbtn.active{background:#467df5;color:white}
.chat{flex:1;overflow:auto;padding:20px;background:#fafafa}
.msg{padding:12px;margin:10px;border-radius:12px;white-space:pre-wrap}
.user{background:#4285f4;color:white;margin-left:auto}
.ai{background:#eee}
.bottom{padding:15px;display:flex;gap:10px}
.send{background:#467df5;color:white;border:0;border-radius:8px;padding:15px 30px;cursor:pointer}
</style>
</head>
<body>
<div class="header">🤖 框架練習機器人 - Gemini AI V2.3 FINAL</div>
<div class="status">✓ 已連接安全 AI Gateway（Cloudflare Worker）</div>
<div class="container">
<div class="left">
<h3>初始論述</h3>
<textarea id="topic" placeholder="輸入對方說的話"></textarea>
<h3>練習模式</h3>
<select id="mode">
<option value="single">單一框架</option>
<option value="random">隨機一個框架</option>
<option value="fusion">融合所有框架</option>
</select>
<div id="selected">尚未選擇框架</div>
<h3>框架選擇</h3>
<div class="frameworks" id="buttons"></div>
</div>
<div class="right">
<div class="chat" id="chat">請輸入初始論述並選擇框架開始分析</div>
<div class="bottom">
<textarea id="input" placeholder="輸入你的回應"></textarea>
<button class="send" onclick="send()">開始分析</button>
</div>
</div>
</div>
<script>
const WORKER="https://gemini-framework.baquerodownik432.workers.dev/api/chat";
const FRAMEWORKS={
"崩解":"拆解對方假設",
"識別":"找出核心問題",
"確認":"確認事實與需求",
"壓縮":"濃縮核心重點",
"分割":"拆分複雜問題",
"解構":"分析結構",
"架構":"重新組織",
"重構":"建立新觀點",
"植入":"加入新的思考"
};
let selected=null;
Object.keys(FRAMEWORKS).forEach(k=>{
let b=document.createElement("button");
b.className="fbtn";b.innerText=k;
b.onclick=()=>{selected=k;document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("selected").innerText="目前框架："+k};
document.getElementById("buttons").appendChild(b);
});
function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.innerText=t;document.getElementById("chat").appendChild(d)}
async function send(){
let topic=document.getElementById("topic").value.trim();
if(!topic)return alert("請輸入初始論述");
let mode=document.getElementById("mode").value;
if(mode==="random"){let k=Object.keys(FRAMEWORKS);selected=k[Math.floor(Math.random()*k.length)]}
if(mode==="fusion")selected="融合所有框架";
if(!selected)return alert("請選擇框架");
add("原始論述：\n"+topic,"user");
let p=`使用框架：${selected}\n原始論述：${topic}\n請分析核心問題並提供建議回應。`;
try{
let r=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:p}]}]})});
let d=await r.json();add(d.text||"AI沒有回覆","ai");
}catch(e){add("錯誤："+e.message,"ai")}
}
</script>
</body>
</html>
